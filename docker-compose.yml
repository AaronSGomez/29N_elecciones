services:
  postgres_29n:
    image: postgres:16-alpine
    container_name: postgres_29n
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres_data_29n:/var/lib/postgresql/data
    networks:
      - net_29n
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant_29n:
    image: qdrant/qdrant:latest
    container_name: qdrant_29n
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__HTTP_PORT: ${QDRANT_PORT}
      QDRANT__SERVICE__GRPC_PORT: ${QDRANT_GRPC_PORT}
    ports:
      - "127.0.0.1:${QDRANT_PORT}:${QDRANT_PORT}"
    volumes:
      - ./qdrant_storage_29n:/qdrant/storage
    networks:
      - net_29n
    mem_limit: 1024m

  backend_29n:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend_29n
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    depends_on:
      qdrant_29n:
        condition: service_started
      postgres_29n:
        condition: service_healthy
    networks:
      - net_29n
      - odoo-ai-network
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APP_PORT}/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  net_29n:
    name: net_29n
    driver: bridge
  odoo-ai-network:
    external: true
